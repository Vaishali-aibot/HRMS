name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      # Only for the integration-test step below — a real, disposable
      # Postgres container, not the flaky local `prisma dev` proxy some
      # of these tests were originally hard to verify against locally.
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hrms_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hrms_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # `npm ci` runs postinstall -> `prisma generate`, which only reads
      # schema.prisma — it doesn't need a live DATABASE_URL, so this step
      # itself doesn't depend on the postgres service being ready yet.
      - run: npm ci
      # The app's own code (e.g. layout.tsx's `LayoutProps`) references
      # Next.js's ambient route/layout types, normally written to
      # .next/types by `next dev`/`next build` — neither of which runs in
      # this job. `next typegen` generates just those types, with no DB or
      # env vars needed, so tsc can actually resolve them here too.
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm test
      - run: npx prisma migrate deploy
      - run: npm run test:integration
